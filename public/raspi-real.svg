<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330">
  <title>Raspberry Pi 4 Model B</title>
  <defs>
    <!-- 3D Brushed Aluminium Shield & Port Gradient -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0.45">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="0.2" stop-color="#e5e7eb"/>
      <stop offset="0.48" stop-color="#9ca3af"/>
      <stop offset="0.76" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <!-- Emerald Green PCB with 3D Lighting -->
    <linearGradient id="green" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#229954"/>
      <stop offset="0.55" stop-color="#196f3d"/>
      <stop offset="1" stop-color="#0e4b27"/>
    </linearGradient>
    <linearGradient id="pcbEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58d68d"/>
      <stop offset="1" stop-color="#093019"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="chipDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <filter id="elevate3d" x="-12%" y="-12%" width="135%" height="135%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="smShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1h4" stroke="#fff" stroke-opacity=".04" stroke-width=".4"/>
    </pattern>
  </defs>

  <!-- 3D PCB Base Shadow & Thickness Extrusion -->
  <rect x="9" y="11" width="477" height="308" rx="19" fill="#072614"/>
  <rect x="5" y="5" width="477" height="308" rx="19" fill="url(#green)" stroke="url(#pcbEdge)" stroke-width="2.5"/>
  <rect x="6" y="6" width="475" height="306" rx="18" fill="url(#grain)"/>

  <!-- Gold Mounting Holes with 3D Inner Ring -->
  <g>
    <circle cx="24" cy="26" r="12.5" fill="url(#gold)"/>
    <circle cx="24" cy="26" r="6.2" fill="#0d2217" stroke="#06170e" stroke-width="1.5"/>
    <circle cx="362" cy="26" r="12.5" fill="url(#gold)"/>
    <circle cx="362" cy="26" r="6.2" fill="#0d2217" stroke="#06170e" stroke-width="1.5"/>
    <circle cx="24" cy="291" r="12.5" fill="url(#gold)"/>
    <circle cx="24" cy="291" r="6.2" fill="#0d2217" stroke="#06170e" stroke-width="1.5"/>
    <circle cx="362" cy="291" r="12.5" fill="url(#gold)"/>
    <circle cx="362" cy="291" r="6.2" fill="#0d2217" stroke="#06170e" stroke-width="1.5"/>
  </g>

  <!-- Copper High-Speed Differential Traces -->
  <g fill="none" stroke="#58d68d" stroke-opacity=".42" stroke-width="0.9">
    <path d="M55 52v43l50 50v65"/><path d="M63 52v46l47 50v65"/><path d="M71 52v49l44 50v65"/>
    <path d="M79 52v52l41 50v65"/><path d="M87 52v55l38 50v65"/><path d="M95 52v58l35 50v65"/>
    <path d="M103 52v61l32 50v65"/><path d="M111 52v64l29 50v65"/><path d="M119 52v67l26 50v65"/>
    <path d="M127 52v70l23 50v65"/><path d="M135 52v73l20 50v65"/><path d="M143 52v76l17 50v65"/>
  </g>

  <!-- 40-Pin GPIO Header Plastic Base (Aligned with interactive pins at left:45px, top:20px) -->
  <g filter="url(#elevate3d)">
    <rect x="40" y="16" width="310" height="36" rx="3" fill="#11161b" stroke="#374151" stroke-width="1.2"/>
    <rect x="42" y="18" width="306" height="32" rx="2" fill="#182026"/>
  </g>
  <text x="35" y="14" font-family="monospace" font-size="7" font-weight="bold" fill="#e2e8f0" text-anchor="middle">1</text>
  <text x="352" y="14" font-family="monospace" font-size="7" font-weight="bold" fill="#e2e8f0" text-anchor="middle">40</text>
  <text x="195" y="64" font-family="monospace" font-size="8" font-weight="bold" fill="#d1fae5" letter-spacing="1.5" text-anchor="middle">40-PIN GPIO HEADER (J8)</text>

  <!-- PoE 4-Pin Header -->
  <g filter="url(#smShadow)">
    <rect x="326" y="56" width="24" height="24" rx="2" fill="#11161b" stroke="#374151" stroke-width="1"/>
    <circle cx="333" cy="63" r="2.5" fill="url(#gold)"/><circle cx="343" cy="63" r="2.5" fill="url(#gold)"/>
    <circle cx="333" cy="73" r="2.5" fill="url(#gold)"/><circle cx="343" cy="73" r="2.5" fill="url(#gold)"/>
    <text x="318" y="71" font-family="monospace" font-size="6" font-weight="bold" fill="#a7f3d0" text-anchor="end">PoE</text>
  </g>

  <!-- Dual-Band Wi-Fi / BLE Metal RF Shield -->
  <g filter="url(#elevate3d)">
    <rect x="37" y="70" width="66" height="72" rx="3" fill="#64748b" stroke="#f1f5f9" stroke-width="1"/>
    <rect x="40" y="73" width="60" height="66" rx="2" fill="url(#metal)"/>
    <path d="M62 96a11 11 0 0 1 16 0m-13 3a7 7 0 0 1 10 0" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="70" y="112" font-family="Arial,sans-serif" font-size="6.5" font-weight="bold" fill="#334155" text-anchor="middle">CYPRESS</text>
    <text x="70" y="121" font-family="monospace" font-size="5.5" fill="#475569" text-anchor="middle">WLAN + BT 5.0</text>
  </g>

  <!-- Broadcom BCM2711 Quad-Core SoC with 3D Heatspreader -->
  <g filter="url(#elevate3d)">
    <rect x="147" y="135" width="84" height="84" rx="4" fill="#1f2937" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="154" y="142" width="70" height="70" rx="3" fill="url(#metal)" stroke="#f8fafc" stroke-width="1.2"/>
    <text x="189" y="167" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1e293b" text-anchor="middle">BROADCOM®</text>
    <text x="189" y="182" font-family="monospace" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">BCM2711</text>
    <text x="189" y="196" font-family="Arial,sans-serif" font-size="6.5" font-weight="bold" fill="#475569" text-anchor="middle">Cortex-A72 64-bit</text>
  </g>

  <!-- LPDDR4 SDRAM Package (3D Elevated IC) -->
  <g filter="url(#elevate3d)">
    <rect x="249" y="138" width="54" height="78" rx="3" fill="url(#chipDark)" stroke="#475569" stroke-width="1.2"/>
    <circle cx="256" cy="145" r="2" fill="#64748b"/>
    <text x="276" y="172" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">LPDDR4</text>
    <text x="276" y="185" font-family="monospace" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">4GB SDRAM</text>
  </g>

  <!-- VL805 USB 3.0 & Gigabit Ethernet Controller Chips -->
  <g filter="url(#smShadow)">
    <rect x="325" y="92" width="34" height="34" rx="2" fill="url(#chipDark)" stroke="#475569" stroke-width="1"/>
    <text x="342" y="111" font-family="monospace" font-size="5.5" font-weight="bold" fill="#94a3b8" text-anchor="middle">BCM54213</text>
    <rect x="323" y="206" width="36" height="36" rx="2" fill="url(#chipDark)" stroke="#475569" stroke-width="1"/>
    <text x="341" y="226" font-family="monospace" font-size="6" font-weight="bold" fill="#94a3b8" text-anchor="middle">VIA VL805</text>
  </g>

  <!-- Silkscreen Branding & Raspberry Pi Logo -->
  <text x="228" y="88" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle">Raspberry Pi 4 Model B</text>
  <text x="228" y="102" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#a7f3d0" text-anchor="middle">© Raspberry Pi 2019 · ITENAS IoT Lab</text>
  <g fill="none" stroke="#ecfdf5" stroke-width="2.2">
    <ellipse cx="89" cy="181" rx="12" ry="16"/>
    <ellipse cx="70" cy="181" rx="12" ry="16"/>
    <ellipse cx="80" cy="202" rx="12" ry="13"/>
    <path d="M80 164q-30-25-28-2 15 13 28 2 11-28 27-15-6 15-27 15"/>
  </g>

  <!-- Right Side: 3D Metallic Gigabit Ethernet & Dual USB 3.0 / USB 2.0 Stacks -->
  <!-- Gigabit Ethernet -->
  <g filter="url(#elevate3d)">
    <rect x="390" y="16" width="104" height="88" rx="4" fill="url(#metal)" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="398" y="22" width="88" height="76" rx="2" fill="url(#grain)" stroke="#9ca3af" stroke-width="0.6"/>
    <rect x="468" y="26" width="26" height="68" rx="1.5" fill="#1e293b"/>
    <rect x="473" y="33" width="16" height="54" rx="1" fill="#0f172a"/>
    <rect x="486" y="28" width="4" height="10" rx="1" fill="#22c55e"/>
    <rect x="486" y="82" width="4" height="10" rx="1" fill="#eab308"/>
    <text x="432" y="63" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#334155" text-anchor="middle">GIGABIT ETH</text>
  </g>
  <!-- USB 3.0 Stack (Blue Tongues) -->
  <g filter="url(#elevate3d)">
    <rect x="390" y="122" width="104" height="76" rx="4" fill="url(#metal)" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="398" y="128" width="88" height="64" rx="2" fill="url(#grain)" stroke="#9ca3af" stroke-width="0.6"/>
    <rect x="468" y="132" width="26" height="56" rx="1.5" fill="#1e293b"/>
    <rect x="473" y="137" width="16" height="20" rx="1" fill="#2563eb"/>
    <rect x="473" y="163" width="16" height="20" rx="1" fill="#2563eb"/>
    <text x="432" y="163" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">USB 3.0</text>
  </g>
  <!-- USB 2.0 Stack (Black Tongues) -->
  <g filter="url(#elevate3d)">
    <rect x="390" y="216" width="104" height="76" rx="4" fill="url(#metal)" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="398" y="222" width="88" height="64" rx="2" fill="url(#grain)" stroke="#9ca3af" stroke-width="0.6"/>
    <rect x="468" y="226" width="26" height="56" rx="1.5" fill="#1e293b"/>
    <rect x="473" y="231" width="16" height="20" rx="1" fill="#0f172a"/>
    <rect x="473" y="257" width="16" height="20" rx="1" fill="#0f172a"/>
    <text x="432" y="257" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#334155" text-anchor="middle">USB 2.0</text>
  </g>

  <!-- Left DSI Display & Center CSI Camera Ribbon Slots (3D Latch) -->
  <g filter="url(#smShadow)">
    <rect x="10" y="150" width="18" height="100" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="18" y="154" width="8" height="92" rx="1" fill="#fef3c7"/>
    <text x="34" y="200" font-family="monospace" font-size="6.5" font-weight="bold" fill="#d1fae5" text-anchor="middle" transform="rotate(-90 34 200)">DISPLAY (DSI)</text>

    <rect x="292" y="234" width="18" height="74" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="297" y="237" width="8" height="68" rx="1" fill="#fef3c7"/>
    <text x="285" y="271" font-family="monospace" font-size="6.5" font-weight="bold" fill="#d1fae5" text-anchor="middle" transform="rotate(-90 285 271)">CAMERA</text>
  </g>

  <!-- Bottom Edge: USB-C Power, Dual Micro-HDMI, 3.5mm Audio/AV Jack -->
  <g filter="url(#elevate3d)">
    <!-- USB-C Power -->
    <rect x="46" y="282" width="48" height="40" rx="4" fill="url(#metal)" stroke="#f8fafc" stroke-width="1"/>
    <rect x="52" y="310" width="36" height="9" rx="3" fill="#0f172a"/>
    <text x="70" y="276" font-family="monospace" font-size="6.5" font-weight="bold" fill="#ecfdf5" text-anchor="middle">PWR IN (USB-C)</text>
    <!-- Micro-HDMI 0 -->
    <rect x="128" y="282" width="36" height="40" rx="3" fill="url(#metal)" stroke="#f8fafc" stroke-width="1"/>
    <rect x="133" y="310" width="26" height="9" rx="2" fill="#0f172a"/>
    <text x="146" y="276" font-family="monospace" font-size="6.5" font-weight="bold" fill="#ecfdf5" text-anchor="middle">HDMI 0</text>
    <!-- Micro-HDMI 1 -->
    <rect x="204" y="282" width="36" height="40" rx="3" fill="url(#metal)" stroke="#f8fafc" stroke-width="1"/>
    <rect x="209" y="310" width="26" height="9" rx="2" fill="#0f172a"/>
    <text x="222" y="276" font-family="monospace" font-size="6.5" font-weight="bold" fill="#ecfdf5" text-anchor="middle">HDMI 1</text>
    <!-- 3.5mm AV Jack -->
    <rect x="328" y="272" width="28" height="48" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="342" cy="316" r="9" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    <circle cx="342" cy="316" r="5" fill="#09090b"/>
  </g>

  <!-- Status LEDs (PWR Red & ACT Green) -->
  <rect x="30" y="274" width="6" height="9" rx="1.5" fill="#ef4444" stroke="#fca5a5" stroke-width="0.8"/>
  <rect x="30" y="259" width="6" height="9" rx="1.5" fill="#22c55e" stroke="#86efac" stroke-width="0.8"/>
  <text x="33" y="254" font-family="monospace" font-size="5.5" font-weight="bold" fill="#ecfdf5" text-anchor="middle">ACT</text>
</svg>